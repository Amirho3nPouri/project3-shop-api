{% extends 'shop/base.html' %} {% load static %} {% block title %}محصولات |
PhemaPlant{% endblock %} {% block content %}

<section class="py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <h1
        class="text-3xl md:text-4xl font-bold mb-4 text-phema-text dark:text-phema-text-dark"
      >
        محصولات ما
      </h1>
      <p class="opacity-70">گیاهان و لوازم جانبی، انتخاب‌شده با عشق ✧</p>
    </div>

    <div
      class="bg-white dark:bg-white/5 rounded-2xl p-6 mb-8 shadow-sm transition-colors duration-500"
    >
      <div class="flex flex-col md:flex-row gap-4 mb-4">
        <div class="flex-1">
          <input
            type="text"
            id="search-input"
            placeholder="جستجو در محصولات..."
            class="w-full px-4 py-3 rounded-xl border border-phema-text/10 dark:border-phema-gold/20 bg-phema-bg dark:bg-phema-bg-dark focus:border-phema-green dark:focus:border-phema-gold focus:outline-none transition-colors"
          />
        </div>

        <select
          id="ordering-select"
          class="px-4 py-3 rounded-xl border border-phema-text/10 dark:border-phema-gold/20 bg-phema-bg dark:bg-phema-bg-dark focus:border-phema-green dark:focus:border-phema-gold focus:outline-none transition-colors"
        >
          <option value="-created_at">جدیدترین</option>
          <option value="price">ارزان‌ترین</option>
          <option value="-price">گران‌ترین</option>
          <option value="name">حروف الفبا</option>
        </select>
      </div>

      <div class="flex flex-wrap gap-2" id="categories-filter">
        <button
          data-category=""
          class="category-btn px-4 py-2 rounded-full bg-phema-bg dark:bg-phema-bg-dark text-sm font-medium transition-all hover:bg-phema-green hover:text-white"
        >
          همه
        </button>
      </div>
    </div>

    <div
      id="products-grid"
      class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6"
    ></div>

    <div id="empty-state" class="hidden text-center py-20">
      <div class="text-6xl mb-4">🌱</div>
      <h3 class="text-xl font-bold mb-2">محصولی پیدا نشد</h3>
      <p class="opacity-70">فیلترها رو تغییر بده یا دوباره جستجو کن.</p>
    </div>

    <div id="pagination" class="hidden flex justify-center gap-2 mt-12"></div>
  </div>
</section>

{% endblock %} {% block extra_js %}
<script>
  (function () {
    const API_BASE = "/api";
    const productsGrid = document.getElementById("products-grid");
    const emptyState = document.getElementById("empty-state");
    const pagination = document.getElementById("pagination");
    const searchInput = document.getElementById("search-input");
    const orderingSelect = document.getElementById("ordering-select");
    const categoriesFilter = document.getElementById("categories-filter");

    let currentFilters = {
      search: "",
      ordering: "-created_at",
      category: "",
      page: 1,
    };

    // ==================== Skeleton ====================
    function showSkeleton() {
      productsGrid.innerHTML = "";
      productsGrid.classList.remove("hidden");
      emptyState.classList.add("hidden");
      pagination.classList.add("hidden");

      for (let i = 0; i < 8; i++) {
        productsGrid.innerHTML += window.createProductSkeleton();
      }
    }

    // ==================== Update Active Category ====================
    function updateActiveCategory(activeBtn) {
      document.querySelectorAll(".category-btn").forEach((btn) => {
        btn.classList.remove("bg-phema-green", "text-white", "active");
        btn.classList.add("bg-phema-bg", "dark:bg-phema-bg-dark");
      });
      activeBtn.classList.remove("bg-phema-bg", "dark:bg-phema-bg-dark");
      activeBtn.classList.add("bg-phema-green", "text-white", "active");
    }

    // ==================== Load Categories ====================
    async function loadCategories() {
      try {
        const response = await fetch(`${API_BASE}/categories/`);
        const data = await response.json();
        const categories = data.results || data;

        categories.forEach((cat) => {
          const btn = document.createElement("button");
          btn.dataset.category = cat.id;
          btn.className =
            "category-btn px-4 py-2 rounded-full bg-phema-bg dark:bg-phema-bg-dark text-sm font-medium transition-all hover:bg-phema-green hover:text-white";
          btn.textContent = cat.name;
          btn.addEventListener("click", () => {
            currentFilters.category = cat.id;
            currentFilters.page = 1;
            updateActiveCategory(btn);
            loadProducts();
          });
          categoriesFilter.appendChild(btn);
        });
      } catch (error) {
        console.error("Error loading categories:", error);
      }
    }

    // ==================== Load Products ====================
    async function loadProducts() {
      showSkeleton();

      const params = new URLSearchParams();
      if (currentFilters.search) params.append("search", currentFilters.search);
      if (currentFilters.ordering)
        params.append("ordering", currentFilters.ordering);
      if (currentFilters.category)
        params.append("category", currentFilters.category);
      if (currentFilters.page) params.append("page", currentFilters.page);

      try {
        await new Promise((resolve) => setTimeout(resolve, 500));

        const response = await fetch(
          `${API_BASE}/products/?${params.toString()}`,
        );
        const data = await response.json();
        const products = data.results || data;

        if (products.length === 0) {
          productsGrid.classList.add("hidden");
          emptyState.classList.remove("hidden");
          return;
        }

        productsGrid.innerHTML = "";
        products.forEach((product) => {
          productsGrid.appendChild(createProductCard(product));
        });

        if (data.next || data.previous) {
          renderPagination(data);
        }
      } catch (error) {
        console.error("Error loading products:", error);
        productsGrid.classList.add("hidden");
        emptyState.classList.remove("hidden");
      }
    }

    // ==================== Create Product Card ====================
    function createProductCard(product) {
      const div = document.createElement("div");
      div.className =
        "group bg-white dark:bg-white/5 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300";

      const price = parseInt(product.price).toLocaleString("fa-IR");

      div.innerHTML = `
            <a href="/products/${escapeHTML(product.slug)}/" class="block">
                <div class="aspect-square bg-phema-green/10 dark:bg-phema-gold/5 flex items-center justify-center text-6xl overflow-hidden">
                    ${
                      product.image
                        ? `<img src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">`
                        : "🌱"
                    }
                </div>
            </a>
            <div class="p-5">
                <a href="/products/${escapeHTML(product.slug)}/">
                    <h3 class="font-bold mb-2 group-hover:text-phema-green dark:group-hover:text-phema-gold transition-colors">${escapeHTML(product.name)}</h3>
                </a>
                <p class="text-sm opacity-60 mb-3">${escapeHTML(product.description ? product.description.substring(0, 50) + "..." : "بدون توضیحات")}</p>
                <div class="flex justify-between items-center">
                    <span class="text-lg font-bold text-phema-green dark:text-phema-gold transition-colors">${price} تومان</span>
                    <button class="add-to-cart-btn small w-10 h-10 rounded-full bg-phema-green dark:bg-phema-gold text-white dark:text-phema-text flex items-center justify-center transition-colors" title="افزودن به سبد" data-product-id="${product.id}">
                        <span class="cart-plant">🪴</span>
                        <span class="cart-box">📦</span>
                        <svg class="btn-text w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                ${!product.is_available ? '<p class="text-xs text-red-500 mt-2">ناموجود</p>' : ""}
            </div>
        `;

      const addBtn = div.querySelector(".add-to-cart-btn");
      if (addBtn) {
        addBtn.addEventListener("click", function (e) {
          e.preventDefault();
          const productId = parseInt(this.dataset.productId);
          window.addToCartAnimated(productId, this, 1);
        });
      }

      return div;
    }

    // ==================== Render Pagination ====================
    function renderPagination(data) {
      pagination.innerHTML = "";
      pagination.classList.remove("hidden");

      const urlParams = new URLSearchParams(
        data.next ? data.next.split("?")[1] : data.previous.split("?")[1],
      );
      const currentPage = parseInt(urlParams.get("page")) || 1;
      const totalPages = Math.ceil(data.count / 8);

      if (data.previous) {
        const prevBtn = document.createElement("button");
        prevBtn.className =
          "px-4 py-2 rounded-lg bg-white dark:bg-white/5 hover:bg-phema-green hover:text-white transition-colors";
        prevBtn.textContent = "قبلی";
        prevBtn.addEventListener("click", () => {
          currentFilters.page = currentPage - 1;
          loadProducts();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        pagination.appendChild(prevBtn);
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
          const pageBtn = document.createElement("button");
          pageBtn.className =
            i === currentPage
              ? "px-4 py-2 rounded-lg bg-phema-green text-white font-bold"
              : "px-4 py-2 rounded-lg bg-white dark:bg-white/5 hover:bg-phema-green hover:text-white transition-colors";
          pageBtn.textContent = i;
          pageBtn.addEventListener("click", () => {
            currentFilters.page = i;
            loadProducts();
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          pagination.appendChild(pageBtn);
        }
      }

      if (data.next) {
        const nextBtn = document.createElement("button");
        nextBtn.className =
          "px-4 py-2 rounded-lg bg-white dark:bg-white/5 hover:bg-phema-green hover:text-white transition-colors";
        nextBtn.textContent = "بعدی";
        nextBtn.addEventListener("click", () => {
          currentFilters.page = currentPage + 1;
          loadProducts();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        pagination.appendChild(nextBtn);
      }
    }

    // ==================== Event Listeners ====================
    let searchTimeout;
    searchInput.addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentFilters.search = e.target.value.trim();
        currentFilters.page = 1;
        loadProducts();
      }, 500);
    });

    orderingSelect.addEventListener("change", (e) => {
      currentFilters.ordering = e.target.value;
      currentFilters.page = 1;
      loadProducts();
    });

    // ==================== Init ====================
    const allBtn = document.querySelector('.category-btn[data-category=""]');
    if (allBtn) {
      allBtn.addEventListener("click", () => {
        currentFilters.category = "";
        currentFilters.page = 1;
        updateActiveCategory(allBtn);
        loadProducts();
      });
      updateActiveCategory(allBtn);
    }

    loadCategories();
    loadProducts();
  })();
</script>
{% endblock %}
